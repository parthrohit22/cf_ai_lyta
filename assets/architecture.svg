<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title{font-family:Arial, Helvetica, sans-serif;font-weight:700;fill:#111827}
      .body{font-family:Arial, Helvetica, sans-serif;font-weight:400;fill:#111827}
      .muted{font-family:Arial, Helvetica, sans-serif;font-weight:400;fill:#6b7280}
      .small{font-size:18px}
      .box{fill:#ffffff;stroke:#e5e7eb;stroke-width:2}
      .line{stroke:#9ca3af;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="18" fill="#f7f7f8"/>

  <text x="96" y="96" class="title" font-size="44">LYTA architecture</text>
  <text x="96" y="136" class="muted" font-size="22">Edge-native workspace with isolated state, reusable retrieval, streaming chat, and board-ready output.</text>

  <rect x="96" y="202" width="292" height="520" rx="12" class="box"/>
  <text x="128" y="252" class="muted small">Client</text>
  <text x="128" y="292" class="title" font-size="30">Browser UI</text>
  <line x1="128" y1="326" x2="356" y2="326" stroke="#e5e7eb" stroke-width="2"/>
  <text x="128" y="374" class="body small">Minimal workspace shell</text>
  <text x="128" y="414" class="body small">Uploads and extraction</text>
  <text x="128" y="454" class="body small">SSE stream reader</text>
  <text x="128" y="494" class="body small">Output board</text>
  <text x="128" y="560" class="muted" font-size="16">Vanilla HTML, CSS, and JS.</text>
  <text x="128" y="586" class="muted" font-size="16">No major frontend framework.</text>

  <rect x="506" y="202" width="292" height="520" rx="12" class="box"/>
  <text x="538" y="252" class="muted small">Edge orchestration</text>
  <text x="538" y="292" class="title" font-size="30">Worker Router</text>
  <line x1="538" y1="326" x2="766" y2="326" stroke="#e5e7eb" stroke-width="2"/>
  <text x="538" y="374" class="body small">Resolve principal</text>
  <text x="538" y="414" class="body small">Validate requests</text>
  <text x="538" y="454" class="body small">Import/search library</text>
  <text x="538" y="494" class="body small">Forward chat request</text>
  <text x="538" y="560" class="muted" font-size="16">Adds request ids and clean</text>
  <text x="538" y="586" class="muted" font-size="16">chat fallback responses.</text>

  <rect x="916" y="202" width="360" height="520" rx="12" class="box"/>
  <text x="948" y="252" class="muted small">State layer</text>
  <text x="948" y="292" class="title" font-size="30">Durable Objects</text>
  <line x1="948" y1="326" x2="1244" y2="326" stroke="#e5e7eb" stroke-width="2"/>

  <rect x="948" y="358" width="264" height="72" rx="10" fill="#f7f7f8" stroke="#e5e7eb" stroke-width="2"/>
  <text x="972" y="390" class="title" font-size="20">AuthDirectory</text>
  <text x="972" y="416" class="muted" font-size="16">Accounts and auth sessions</text>

  <rect x="948" y="460" width="264" height="72" rx="10" fill="#f7f7f8" stroke="#e5e7eb" stroke-width="2"/>
  <text x="972" y="492" class="title" font-size="20">Workspace</text>
  <text x="972" y="518" class="muted" font-size="16">Profile, files, chat index</text>

  <rect x="948" y="562" width="264" height="72" rx="10" fill="#f7f7f8" stroke="#e5e7eb" stroke-width="2"/>
  <text x="972" y="594" class="title" font-size="20">Conversation</text>
  <text x="972" y="620" class="muted" font-size="16">Memory, summaries, stream</text>

  <rect x="1370" y="202" width="234" height="520" rx="12" class="box"/>
  <text x="1402" y="252" class="muted small">AI services</text>
  <text x="1402" y="292" class="title" font-size="30">Workers AI</text>
  <line x1="1402" y1="326" x2="1572" y2="326" stroke="#e5e7eb" stroke-width="2"/>

  <rect x="1402" y="370" width="170" height="82" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="1422" y="406" class="title" font-size="21">Chat model</text>
  <text x="1422" y="432" class="muted" font-size="16">Streaming responses</text>

  <rect x="1402" y="492" width="170" height="82" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="1422" y="528" class="title" font-size="21">Embeddings</text>
  <text x="1422" y="554" class="muted" font-size="16">Retrieval vectors</text>

  <path d="M388 386H506" class="line" marker-end="url(#arrow)"/>
  <text x="430" y="366" class="muted" font-size="15">HTTP</text>

  <path d="M798 386H916" class="line" marker-end="url(#arrow)"/>
  <text x="832" y="366" class="muted" font-size="15">state</text>

  <path d="M1276 396H1370" class="line" marker-end="url(#arrow)"/>
  <text x="1300" y="376" class="muted" font-size="15">chat</text>

  <path d="M1370 534H1276" class="line" marker-end="url(#arrow)"/>
  <text x="1306" y="566" class="muted" font-size="15">vectors</text>

  <path d="M798 498H916" class="line" marker-end="url(#arrow)"/>
  <text x="824" y="530" class="muted" font-size="15">library</text>

  <path d="M916 602H798" class="line" marker-end="url(#arrow)"/>
  <text x="814" y="634" class="muted" font-size="15">SSE response</text>

  <rect x="96" y="782" width="1408" height="74" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="128" y="826" class="title" font-size="20">Reliability boundary</text>
  <text x="360" y="826" class="muted" font-size="19">SSE response opens before model execution. Retrieval, title, follow-up, and summary failures degrade without Cloudflare 1101 pages.</text>
</svg>
